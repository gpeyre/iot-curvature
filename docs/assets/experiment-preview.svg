<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" role="img" aria-labelledby="preview-title preview-desc">
<title id="preview-title">Paired annulus transport and its empirical gap</title>
<desc id="preview-desc">Sixty independent Gaussian source points and their radial annulus images, using seed seven. Lines show the exact optimal assignment for the cost matrix diag(0.85, 0.15). Source and target clouds use the same coordinate scale and are translated apart. The lower graph shows the mean score improvement over the observed pairing at forty-one equally spaced cost parameters, with the selected parameter highlighted. Lines between evaluated losses are visual guides.</desc>
